<header class="bg-tecrob-black text-white shadow-lg">
  <div class="flex items-center justify-between px-6 py-2">
    
    <!-- Logo TecRob -->
    <img src="assets/logo.png" alt="Logo TecRob" class="w-40 h-24 object-contain">

    <!-- Info contacto -->
    <div class="hidden md:flex items-center gap-6 text-sm">
      <span class="flex items-center gap-2">
        <span class="text-tecrob-red">📞</span>
        <span>943582185 / 996504233</span>
      </span>
      <span class="flex items-center gap-2">
        <span class="text-tecrob-red">✉️</span>
        <span>ventas&#64;tecrob.com</span>
      </span>
    </div>

    <!-- Usuario -->
    <div class="flex items-center gap-3">
      <div class="text-right hidden sm:block">
        <p class="text-sm font-semibold leading-tight">{{ usuario?.nombre }}</p>
        <p class="text-xs text-tecrob-grayMid capitalize">{{ usuario?.rol }}</p>
      </div>
      <div class="w-9 h-9 bg-tecrob-red rounded-full flex items-center justify-center font-bold cursor-pointer hover:bg-tecrob-redDark transition-all"
           (click)="cerrarSesion()">
        {{ inicialUsuario }}
      </div>
    </div>

  </div>
</header>
