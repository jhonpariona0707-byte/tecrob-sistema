<div class="login-container">

  <!-- Formas geométricas decorativas -->
  <div class="shape shape-top-left"></div>
  <div class="shape shape-top-left-line"></div>
  <div class="shape shape-bottom-right"></div>
  <div class="shape shape-bottom-right-line"></div>

  <!-- Contenido central -->
  <div class="login-box">
    
    <!-- Logo -->
    <div class="text-center mb-6">
      <img src="assets/logo.png" alt="Logo TecRob" class="w-full max-w-60 h-auto mx-auto">
    </div>

    <!-- Mensaje de error -->
    <div *ngIf="error" class="bg-red-100 border-l-4 border-tecrob-red text-tecrob-red p-3 rounded mb-4 text-sm">
      ❌ {{ error }}
    </div>

    <!-- Formulario -->
    <form (ngSubmit)="onSubmit()" class="space-y-4">
      
      <div>
        <label class="block text-sm font-semibold text-tecrob-black mb-1">
          Correo Electrónico
        </label>
        <input 
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="correo&#64;empresa.com"
          class="w-full px-4 py-3 border-2 border-tecrob-grayMid rounded-lg focus:border-tecrob-red focus:outline-none transition-all"
          [disabled]="cargando"
        >
      </div>

      <div>
        <label class="block text-sm font-semibold text-tecrob-black mb-1">
          Contraseña
        </label>
        <input 
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="••••••••"
          class="w-full px-4 py-3 border-2 border-tecrob-grayMid rounded-lg focus:border-tecrob-red focus:outline-none transition-all"
          [disabled]="cargando"
        >
      </div>

      <button 
        type="submit"
        [disabled]="cargando"
        class="w-full bg-tecrob-red hover:bg-tecrob-redDark text-white font-bold py-3 rounded-lg transition-all shadow-lg hover:shadow-xl disabled:opacity-50 disabled:cursor-not-allowed">
        {{ cargando ? 'Ingresando...' : 'Ingresar' }}
      </button>

      <div class="bg-gray-50 border border-tecrob-grayMid rounded-lg p-3 mt-4 text-xs text-tecrob-grayText">
        Inicia sesión con una cuenta activa registrada en la base de datos.
      </div>

    </form>

  </div>

</div>
