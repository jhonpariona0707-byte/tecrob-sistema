spring.application.name=tecrob-backend

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/tienda_reparacion}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:3000}
spring.datasource.hikari.initialization-fail-timeout=-1

spring.sql.init.mode=never

tecrob.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}
tecrob.upload-dir=${TECROB_UPLOAD_DIR:uploads/products}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
